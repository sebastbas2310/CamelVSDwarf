plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'CamelVSDwarf'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            exclude 'com/example/camelvsdwarf/audit/entity/**'
            exclude 'com/example/camelvsdwarf/audit/repository/**'
            exclude 'com/example/camelvsdwarf/competitor/dto/**'
            exclude 'com/example/camelvsdwarf/competitor/entity/**'
            exclude 'com/example/camelvsdwarf/competitor/repository/**'
            exclude 'com/example/camelvsdwarf/race/dto/**'
            exclude 'com/example/camelvsdwarf/race/entity/**'
            exclude 'com/example/camelvsdwarf/race/repository/**'
            exclude 'com/example/camelvsdwarf/registration/dto/**'
            exclude 'com/example/camelvsdwarf/registration/entity/**'
            exclude 'com/example/camelvsdwarf/registration/repository/**'
            exclude 'com/example/camelvsdwarf/result/dto/**'
            exclude 'com/example/camelvsdwarf/result/entity/**'
            exclude 'com/example/camelvsdwarf/result/repository/**'
            exclude 'com/example/camelvsdwarf/team/dto/**'
            exclude 'com/example/camelvsdwarf/team/entity/**'
            exclude 'com/example/camelvsdwarf/team/repository/**'
            exclude 'com/example/camelvsdwarf/user/dto/**'
            exclude 'com/example/camelvsdwarf/user/entity/**'
            exclude 'com/example/camelvsdwarf/user/repository/**'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server' // <-- AGREGADO
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator' //Agregado
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-mongodb-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2' //Agregado
    testImplementation 'org.springframework.boot:spring-boot-restclient' //Agregado
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()

    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion= '0.8.14'
}

def coberturaExcluida= [
        '**/CamelVSDwarfApplication.class',
        '**/config/**',
        '**/dto/**',
        '**/entity/**'
]

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')

    reports {
        html.required = true   // la página que se abre en el navegador
        xml.required = true    // formato que leen SonarQube / CI
        csv.required = false
    }

    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coberturaExcluida)
            })
    )
}

// Falla el build si la cobertura baja del mínimo. Útil para que un cambio no
// meta lógica nueva sin tests sin que nadie se dé cuenta.
tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
        rule {
            element = 'CLASS'
            // Los mappers/servicios sí deben tener sus ramas cubiertas.
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
            excludes = ['com.example.camelvsdwarf.CamelVsDwarfApplication']
        }
    }

    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coberturaExcluida)
            })
    )
}

// Engancha la verificación a "check" (y por tanto a "build"): si alguien mete
// lógica nueva sin tests, el build falla en vez de pasar en silencio.
tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Tarea de conveniencia: corre los tests, arma los reportes y te dice dónde
// quedaron. "./gradlew cobertura"
tasks.register('cobertura') {
    group = 'verification'
    description = 'Corre los tests y genera los reportes HTML de tests y cobertura.'
    dependsOn tasks.named('jacocoTestReport')

    def reporteTests = layout.buildDirectory.file('reports/tests/test/index.html')
    def reporteCobertura = layout.buildDirectory.file('reports/jacoco/test/html/index.html')

    doLast {
        println ''
        println 'Reportes generados:'
        println "  Tests     -> ${reporteTests.get().asFile.toURI()}"
        println "  Cobertura -> ${reporteCobertura.get().asFile.toURI()}"
        println ''
    }
}

// Igual que "cobertura", pero además abre las dos páginas en el navegador.
// "./gradlew coberturaAbrir"
tasks.register('coberturaAbrir') {
    group = 'verification'
    description = 'Corre los tests, genera los reportes y los abre en el navegador.'
    dependsOn tasks.named('cobertura')

    def reportes = [
            layout.buildDirectory.file('reports/tests/test/index.html'),
            layout.buildDirectory.file('reports/jacoco/test/html/index.html')
    ]
    def so = System.getProperty('os.name').toLowerCase()

    doLast {
        def comando = so.contains('mac') ? 'open' : so.contains('win') ? 'explorer' : 'xdg-open'
        reportes.each { reporte ->
            // ProcessBuilder en vez de exec {}: Gradle 9 eliminó Project.exec().
            new ProcessBuilder(comando, reporte.get().asFile.absolutePath).start().waitFor()
        }
    }
}

// El plugin de Spring Boot genera DOS jars: el ejecutable y uno "-plain" con
// solo las clases. Eso rompía el Dockerfile, porque "COPY build/libs/*.jar
// app.jar" encontraba dos archivos y Docker falla cuando el origen es múltiple
// y el destino es un solo archivo.
tasks.named('jar') {
    enabled = false
}

// Nombre fijo del jar ejecutable: así el Dockerfile lo copia por nombre exacto
// y no depende de la versión del proyecto.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
