spring.application.name=CamelVSDwarf

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:camel_vs_dwarf}}
spring.datasource.username=${DB_USERNAME:camel_user}
spring.datasource.password=${DB_PASSWORD:camel_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

app.jwt.secret=${JWT_SECRET:change-me-in-local-environment}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${SUPABASE_PROJECT_ID:your-project-id}.supabase.co/auth/v1
