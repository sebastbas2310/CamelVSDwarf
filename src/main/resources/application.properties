spring.application.name=CamelVSDwarf

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

app.jwt.secret=${JWT_SECRET:change-me-in-local-environment}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${SUPABASE_PROJECT_ID:your-project-id}.supabase.co/auth/v1
supabase.jwt.secret=${SUPABASE_JWT_SECRET:change-me-supabase-jwt-secret}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
